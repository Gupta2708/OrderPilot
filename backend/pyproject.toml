[project]
name = "orderpilot-backend"
version = "0.1.0"
description = "OrderPilot FastAPI and Temporal foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "temporalio>=1.10,<2",
  "anthropic>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
